{% extends "base.html" %} {% block content %}
<main class="admin-auth-page">
  <header class="admin-header">
    <a class="admin-brand" href="/">GBSW_Pay</a>
    <form method="post" action="/logout">
      <button class="logout-button" type="submit">로그아웃</button>
    </form>
  </header>
  <section class="admin-dashboard" aria-labelledby="booth-title">
    <p class="eyebrow">
      BOOTH{% if admin.booth_id %} · {{ admin.booth_id }}{% endif %}
    </p>
    <h1 id="booth-title">{{ admin.username }}님, 안녕하세요.</h1>
    <p>부스 운영 화면입니다.</p>
    <p class="admin-note">
      학생증 인식과 포인트 사용 기능을 이 화면에 추가합니다.
    </p>
  </section>
</main>
{% endblock %}
